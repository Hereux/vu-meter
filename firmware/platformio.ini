; Zwei Umgebungen:
;   native  -- DSP-Tests auf dem PC, ohne Hardware      pio test -e native
;   esp32   -- Zielsystem ESP32-2432S028R ("CYD")       pio run -e esp32 -t upload
;
; Ohne PlatformIO geht der Test auch mit:  make -C firmware test

[platformio]
src_dir = src

[env:native]
platform = native
test_framework = custom
test_filter = test_dsp
test_build_src = yes
; main.cpp braucht Arduino, darf im PC-Test nicht mitgebaut werden
build_src_filter = +<*> -<main.cpp>
build_flags = -std=c++17 -O2 -Wall -Wextra

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -O2
    -Wall
    ; TFT_eSPI auf das Display des ESP32-2432S028R einstellen.
    ; Vor dem ersten Flashen gegen die eigene Boardrevision pruefen.
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    sparkfun/SparkFun BMP581 Arduino Library@^1.0.2
